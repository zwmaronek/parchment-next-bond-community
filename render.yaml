services:
  - type: web
    name: parchment-next-bond-community
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: parchment-next-bond-db
          property: connectionString
      # Optional: set GROQ_API_KEY in the Render dashboard (free tier, no
      # card, from console.groq.com) to use an AI summary and AI draft
      # advice. Without it, the site uses automatic checks built only
      # from the workshop records. Never commit a key to this repo.
databases:
  - name: parchment-next-bond-db
    plan: free
